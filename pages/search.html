<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>try{var t=localStorage.getItem("tm_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>TalentMatch TN — Recherche d'entreprises</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/components.css"></head>
<body data-page="search" data-root="../">
<aside class="sidebar" id="sidebar"><div class="brand">Talent<b>Match</b> TN</div><nav id="nav"></nav></aside>
<div class="main"><header class="topbar"><button class="btn ghost" id="menuBtn" aria-label="Menu">☰</button>
<input id="globalSearch" type="search" placeholder="Rechercher un étudiant (Entrée)…"><span id="modeBadge" class="badge"></span><span id="n8nStatus" class="badge">n8n : …</span><span class="avatar">AD</span></header>
<main class="content"><div class="page-head"><h1>Recherche d'entreprises</h1></div>
<div class="notice">La recherche est exécutée par votre workflow n8n. Le classement reflète les résultats de recherche et leur pertinence selon le workflow, pas un classement officiel des « meilleures » entreprises.</div>
<div class="card" style="margin:14px 0"><div class="domain-chips" id="domainChips" role="group" aria-label="Domaines rapides"></div><div class="form"><label>Domaine<select id="domainSelect"></select></label><label>Sous-domaine<input id="sub"></label><label>Ville<input id="city" placeholder="Tunis, Sfax…"></label>
<label>Type d'opportunité<select id="opp"><option value="">Tous</option><option>Stage d'été</option><option>Stage PFE</option><option>Stage d'initiation</option><option>Stage de perfectionnement</option><option>Junior</option></select></label>
<label>Mots-clés<input id="kw"></label><label>Nombre de résultats<input id="limit" type="number" min="1" max="20" value="10"></label></div>
<div class="actions" style="margin-top:12px"><button class="btn primary" id="go">Rechercher des entreprises</button><button class="btn" id="refresh">Actualiser les résultats</button><button class="btn" id="matchAll">Lancer le matching avec les étudiants</button></div></div>
<section class="search-results" aria-live="polite">
<div id="state"></div>
<div id="resultsHeader" class="results-header" hidden>
  <div><p class="eyebrow">RÉSULTATS DE RECHERCHE</p><h2 id="resultsTitle"></h2><p id="resultsSummary" class="muted"></p></div>
  <div class="results-tools"><label>Filtrer les résultats<input id="resultsFilter" type="search" placeholder="Nom, domaine, spécialité…"></label>
    <label id="sortWrap" hidden>Trier par<select id="resultsSort"><option value="relevance">Pertinence</option><option value="name">Nom</option></select></label>
    <span id="resultsCount" class="results-count"></span>
  </div>
</div>
<div id="res" class="search-company-grid"></div><div id="srcs" class="muted small"></div>
</section>
</main></div><div id="toasts" class="toasts"></div>
<script src="../js/config.js"></script><script src="../js/utils.js"></script><script src="../js/dataStore.js"></script>
<script src="../js/services/n8nService.js"></script><script src="../js/services/studentsService.js"></script><script src="../js/services/companiesService.js"></script><script src="../js/services/matchingService.js"></script>
<script src="../js/app.js"></script><script src="../js/pages/search.js"></script></body></html>
